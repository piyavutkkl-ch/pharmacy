# กันระบบหลับ (ฟรี 100%)
#  1) Supabase ฟรีจะหยุดโปรเจกต์ถ้าไม่มีการใช้งาน 7 วัน → เรียกฐานข้อมูลสัปดาห์ละ 2 ครั้ง
#  2) GitHub ปิดงานตั้งเวลาอัตโนมัติถ้า repo ไม่มีความเคลื่อนไหว 60 วัน → สั่งเปิดงานไว้ทุกครั้ง
# ใช้แค่ URL + publishable key ที่อยู่ใน js/config.js (ค่าสาธารณะ) ไม่ต้องตั้ง secret
name: keepalive
on:
  schedule:
    - cron: '41 1 * * 1,4'        # จันทร์ + พฤหัส 08:41 น. เวลาไทย
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: เรียกฐานข้อมูล Supabase
        run: |
          url=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/config.js | head -1)
          key=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" js/config.js | head -1)
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/rest/v1/units?select=id&limit=1" -H "apikey: $key" || true)
            [ "$code" = 200 ] && break
            sleep 30
          done
          echo "Supabase → HTTP $code"
          if [ "$code" != 200 ]; then
            echo "::error::เรียก Supabase ไม่ได้ (HTTP $code) — โปรเจกต์อาจถูกหยุด: เข้า supabase.com/dashboard แล้วกด Restore project"
            exit 1
          fi
      - name: เปิดงานตั้งเวลาไว้เสมอ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml backup.yml ai-news.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" >/dev/null && echo "enabled $wf" || echo "skip $wf"
          done
