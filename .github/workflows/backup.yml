# สำรองข้อมูลรายสัปดาห์ → Google Drive กลาง (เข้ารหัส AES-256) · วิธีตั้งค่า: docs/BACKUP.md
# repo นี้เป็นสาธารณะ: ค่าลับทั้งหมดอยู่ใน Settings → Secrets and variables → Actions เท่านั้น
# และสคริปต์ไม่พิมพ์ข้อมูลจริงลง log (พิมพ์แค่จำนวน/ขนาด)
name: backup
on:
  schedule:
    - cron: '23 19 * * 6'         # อาทิตย์ 02:23 น. เวลาไทย (ต้นเดือนเก็บไฟล์ครบชุด สัปดาห์อื่นเก็บเฉพาะไฟล์ใหม่)
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = ตามปกติ · full = ไฟล์ครบชุด · inc = เฉพาะไฟล์ใหม่ · db-only = ฐานข้อมูลอย่างเดียว'
        type: choice
        options: [auto, full, inc, db-only]
        default: auto
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      verifydb:                    # Postgres ชั่วคราว ใช้ทดลองกู้ไฟล์สำรองทุกครั้ง (ลบทิ้งเมื่องานจบ)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: สำรองข้อมูล
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          VERIFY_DB_URL: postgresql://postgres:verify-only@localhost:5432/postgres
        run: |
          export SUPABASE_URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/config.js | head -1)
          bash tools/backup/backup.sh
