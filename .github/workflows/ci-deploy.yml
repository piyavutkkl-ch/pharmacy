# ทดสอบ → (รวมงานของ Claude เข้า main) → อัปเดตฐานข้อมูล → ขึ้นเว็บ   อัตโนมัติทั้งหมด ไม่ต้องกดอะไร
#
#   Claude push ไป branch claude/…  → ทดสอบของที่รวมกับ main แล้ว → ผ่าน = push เข้า main → สั่งรอบ main ต่อ
#   push/สั่งรันบน main             → ทดสอบ → อัปเดตฐานข้อมูล (ถ้ามีไฟล์ SQL ใหม่ · สำรองก่อน) → deploy GitHub Pages → ตรวจว่าเว็บจริงเป็นรุ่นใหม่
#   ขั้นไหนไม่ผ่าน = หยุด เว็บจริงยังเป็นรุ่นเดิม
#
# ครั้งเดียว: Settings → Pages → Source = "GitHub Actions" · ค่าลับทั้งหมดอยู่ใน Secrets (ดู docs/BACKUP.md)
name: ci-deploy
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # push เข้า main เมื่อทดสอบงานของ Claude ผ่าน
      actions: write           # สั่งรอบ main ต่อ (push ด้วย GITHUB_TOKEN ไม่เริ่ม workflow ใหม่ให้เอง)
    services:
      postgres:                # ฐานข้อมูลชั่วคราวสำหรับทดสอบ (ลบทิ้งเมื่อจบ ไม่เกี่ยวกับ Supabase จริง)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: รวมกับ main (ทดสอบของที่จะขึ้นเว็บจริง)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          if ! git merge -q --no-edit origin/main -m "รวม main เข้า ${GITHUB_REF_NAME}"; then
            echo "::error::งานนี้ชนกับโค้ดล่าสุดใน main — ให้ Claude ดึง main มารวมแล้ว push ใหม่"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ติดตั้งเครื่องมือทดสอบ
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          cd tests/ui && npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium >/dev/null
      - name: ทดสอบทั้งหมด (static · ฐานข้อมูล/สิทธิ์ · หน้าเว็บทุกบทบาท · สำรอง/กู้)
        env:
          PG_ADMIN_URL: postgresql://postgres:ci-only@localhost:5432/postgres
        run: bash tests/run_all.sh
      - name: เก็บภาพหน้าจอจากการทดสอบ (ข้อมูลจำลอง)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/ui/shots/
          retention-days: 7
          if-no-files-found: ignore
      - name: ผ่านแล้ว → ส่งเข้า main แล้วสั่งขึ้นเว็บ
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          gh workflow run ci-deploy.yml --ref main
          echo "ส่งเข้า main แล้ว — รอบ main จะอัปเดตฐานข้อมูล (ถ้ามี) และขึ้นเว็บต่อ"

  migrate:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: supabase-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: อัปเดตโครงสร้างฐานข้อมูล (เฉพาะไฟล์ SQL ใหม่ · สำรองก่อนทุกครั้ง)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          export SUPABASE_URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/config.js | head -1)
          bash tools/db/migrate.sh

  deploy:
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: เตรียมไฟล์หน้าเว็บ (เฉพาะไฟล์ที่ต้องขึ้นเว็บ + ติดเลขรุ่นกันแคช)
        id: build
        run: |
          ver="$(TZ=Asia/Bangkok date +%y%m%d.%H%M)-${GITHUB_SHA::7}"
          mkdir _site
          cp -r index.html privacy.html terms.html assets js _site/
          python3 tools/bump_version.py "$ver" _site
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "เว็บรุ่น $ver · $(find _site -type f | wc -l) ไฟล์"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: ตรวจว่าเว็บจริงเป็นรุ่นใหม่แล้ว
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          VER: ${{ steps.build.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            live=$(curl -fsS -H 'Cache-Control: no-cache' "${URL}?check=$RANDOM" | grep -oE 'name="app-version" content="[^"]+"' | cut -d'"' -f4 || true)
            [ "$live" = "$VER" ] && { echo "✓ เว็บจริงเป็นรุ่น $VER แล้ว: $URL"; exit 0; }
            sleep 15
          done
          echo "::warning::deploy สำเร็จแต่ยังเห็นรุ่นเก่า ($live) อาจเป็นแคชของ GitHub Pages — รอ 10 นาทีแล้วเปิดใหม่"
